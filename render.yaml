services:
  - type: web
    name: skilio-backend
    env: python
    region: oregon
    plan: free
    rootDir: skilio-backend-final/skilio-backend-final/skilio-backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head && python scripts/seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: skilio-hackathon-secret-key-change-in-production-long-enough-32chars
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://skilio-frontend.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
