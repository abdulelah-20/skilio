name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: skilio-backend-final/skilio-backend-final/skilio-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skilio-backend-final/skilio-backend-final/skilio-backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Alembic migrations
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./skilio_ci.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long

      - name: Seed database
        run: python scripts/seed.py
        env:
          DATABASE_URL: sqlite:///./skilio_ci.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long

      - name: Run pytest
        run: python -m pytest tests -v --tb=short
        env:
          DATABASE_URL: sqlite:///.:memory:
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
