<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e0a4e"/>
      <stop offset="60%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#020110"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="badgeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
    <filter id="titleGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Center glow -->
  <ellipse cx="800" cy="400" rx="500" ry="380" fill="url(#centerGlow)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="80" r="1.5"/><circle cx="300" cy="50" r="1"/><circle cx="500" cy="100" r="2"/>
    <circle cx="800" cy="40" r="1.5"/><circle cx="1100" cy="80" r="1"/><circle cx="1400" cy="60" r="2"/>
    <circle cx="1550" cy="120" r="1.5"/><circle cx="50" cy="500" r="1"/><circle cx="1550" cy="480" r="1.5"/>
  </g>

  <!-- Confetti -->
  <g opacity="0.8">
    <rect x="180" y="160" width="12" height="20" rx="3" fill="#f59e0b" transform="rotate(25 186 170)"/>
    <rect x="280" y="200" width="10" height="18" rx="2" fill="#ec4899" transform="rotate(-15 285 209)"/>
    <rect x="350" y="140" width="14" height="10" rx="2" fill="#4ade80" transform="rotate(40 357 145)"/>
    <rect x="1200" y="170" width="12" height="20" rx="3" fill="#38bdf8" transform="rotate(-30 1206 180)"/>
    <rect x="1350" y="140" width="10" height="16" rx="2" fill="#f59e0b" transform="rotate(20 1355 148)"/>
    <rect x="1450" y="200" width="14" height="10" rx="2" fill="#ec4899" transform="rotate(-45 1457 205)"/>
    <circle cx="220" cy="250" r="7" fill="#f59e0b" opacity="0.7"/>
    <circle cx="1380" cy="260" r="6" fill="#ec4899" opacity="0.7"/>
    <circle cx="450" cy="180" r="5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="1200" cy="240" r="8" fill="#4ade80" opacity="0.7"/>
    <rect x="120" y="320" width="8" height="15" rx="2" fill="#a78bfa" transform="rotate(35 124 327)"/>
    <rect x="1460" y="310" width="8" height="15" rx="2" fill="#fde68a" transform="rotate(-20 1464 317)"/>
  </g>

  <!-- Star burst behind trophy -->
  <g transform="translate(800, 200)" opacity="0.3">
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(30)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(60)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(90)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(120)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(150)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(180)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(210)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(240)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(270)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(300)"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#f59e0b" stroke-width="3" transform="rotate(330)"/>
  </g>

  <!-- Trophy / completion emoji -->
  <text x="800" y="200" text-anchor="middle" font-size="120" filter="url(#badgeGlow)">🏆</text>

  <!-- Great Job text -->
  <text x="800" y="285" text-anchor="middle" font-size="70" font-weight="900" fill="#fde68a" filter="url(#titleGlow)">Great job, Nova!</text>
  <text x="800" y="335" text-anchor="middle" font-size="24" fill="#c4b5fd">You completed Space Station Safety</text>

  <!-- ===== XP Earned panel ===== -->
  <rect x="460" y="365" width="280" height="130" rx="20" fill="#1e1040" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="400" text-anchor="middle" font-size="16" fill="#a78bfa">XP Earned</text>
  <text x="600" y="450" text-anchor="middle" font-size="52" font-weight="900" fill="#fde68a">+75</text>
  <text x="600" y="482" text-anchor="middle" font-size="14" fill="#8b5cf6">Total: 315 XP</text>

  <!-- ===== Badge Earned panel ===== -->
  <rect x="780" y="365" width="280" height="130" rx="20" fill="#1e1040" stroke="#ec4899" stroke-width="2"/>
  <text x="920" y="400" text-anchor="middle" font-size="16" fill="#a78bfa">Badge Earned!</text>
  <text x="920" y="440" text-anchor="middle" font-size="48" filter="url(#badgeGlow)">🏅</text>
  <text x="920" y="480" text-anchor="middle" font-size="14" fill="#f9a8d4">Space Hero Badge</text>

  <!-- ===== Level progress ===== -->
  <rect x="1100" y="365" width="280" height="130" rx="20" fill="#1e1040" stroke="#4ade80" stroke-width="2"/>
  <text x="1240" y="400" text-anchor="middle" font-size="16" fill="#a78bfa">Level Progress</text>
  <text x="1240" y="435" text-anchor="middle" font-size="14" fill="#6ee7b7">Level 2  →  Level 3</text>
  <rect x="1120" y="445" width="240" height="16" rx="8" fill="#0f0a2e"/>
  <rect x="1120" y="445" width="188" height="16" rx="8" fill="url(#xpBar)"/>
  <text x="1240" y="480" text-anchor="middle" font-size="13" fill="#6ee7b7">315 / 400 XP</text>

  <!-- ===== Action Buttons ===== -->

  <!-- Primary: Continue Learning -->
  <rect x="400" y="540" width="340" height="70" rx="35" fill="url(#btnPrimary)" stroke="#a78bfa" stroke-width="2"/>
  <text x="570" y="583" text-anchor="middle" font-size="22" font-weight="700" fill="white">▶  Continue Learning</text>

  <!-- Secondary: Choose Another World -->
  <rect x="760" y="540" width="340" height="70" rx="35" fill="#1e1040" stroke="#4c1d95" stroke-width="2"/>
  <text x="930" y="583" text-anchor="middle" font-size="20" fill="#c4b5fd">🌍  Choose Another World</text>

  <!-- Back to Kid Home -->
  <rect x="400" y="630" width="340" height="62" rx="31" fill="#1a1040" stroke="#374151" stroke-width="1.5"/>
  <text x="570" y="668" text-anchor="middle" font-size="18" fill="#6b7280">🏠  Back to Kid Home</text>

  <!-- Parent Mode -->
  <rect x="760" y="630" width="340" height="62" rx="31" fill="#1a1040" stroke="#374151" stroke-width="1.5"/>
  <text x="930" y="668" text-anchor="middle" font-size="18" fill="#6b7280">👨‍👩‍👧  Parent Mode</text>

  <!-- Bottom XP total -->
  <rect x="650" y="730" width="300" height="50" rx="25" fill="#0f0a2e" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="800" y="762" text-anchor="middle" font-size="18" fill="#a78bfa">⭐ New total: 315 XP  |  Level 2</text>
</svg>
