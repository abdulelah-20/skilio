<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-size="36" font-weight="800" fill="#e2e8f0">OWASP Top 10 — Skilio Security Mapping</text>
  <line x1="200" y1="66" x2="1400" y2="66" stroke="#1f2937" stroke-width="1.5"/>
  <text x="800" y="90" text-anchor="middle" font-size="16" fill="#64748b">How Skilio addresses each relevant OWASP category</text>

  <!-- ===== OWASP cards — 3 columns × 2 rows top, then extras ===== -->

  <!-- CARD: A01 Broken Access Control -->
  <rect x="50" y="110" width="480" height="170" rx="16" fill="#1e1040" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="50" y="110" width="480" height="44" rx="16" fill="#2d1b69"/>
  <rect x="50" y="136" width="480" height="18" fill="#2d1b69"/>
  <rect x="66" y="122" width="54" height="24" rx="6" fill="#4c1d95"/>
  <text x="93" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#d8b4fe">A01</text>
  <text x="134" y="139" font-size="15" font-weight="700" fill="#e2d9f3">Broken Access Control</text>
  <rect x="400" y="118" width="118" height="24" rx="12" fill="#7c3aed"/>
  <text x="459" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="white">MITIGATED ✓</text>
  <text x="70" y="178" font-size="14" fill="#c4b5fd">Ownership guard:</text>
  <text x="185" y="178" font-size="14" fill="#94a3b8">child.parent_id == user.id on every child route</text>
  <text x="70" y="200" font-size="14" fill="#c4b5fd">Returns 404</text>
  <text x="148" y="200" font-size="14" fill="#94a3b8">for both "not found" and "wrong owner" (no info leak)</text>
  <text x="70" y="222" font-size="14" fill="#c4b5fd">Depends():</text>
  <text x="148" y="222" font-size="14" fill="#94a3b8">authentication enforced at framework level, not manually</text>
  <text x="70" y="256" font-size="13" fill="#6b7280">FastAPI Depends(get_current_user) · All child routes verified</text>

  <!-- CARD: A02 Cryptographic Failures -->
  <rect x="560" y="110" width="480" height="170" rx="16" fill="#1a1040" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="560" y="110" width="480" height="44" rx="16" fill="#1e3a5f"/>
  <rect x="560" y="136" width="480" height="18" fill="#1e3a5f"/>
  <rect x="576" y="122" width="54" height="24" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="603" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#93c5fd">A02</text>
  <text x="644" y="139" font-size="15" font-weight="700" fill="#e2d9f3">Cryptographic Failures</text>
  <rect x="910" y="118" width="118" height="24" rx="12" fill="#1d4ed8"/>
  <text x="969" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="white">MITIGATED ✓</text>
  <text x="580" y="178" font-size="14" fill="#93c5fd">Passwords:</text>
  <text x="664" y="178" font-size="14" fill="#94a3b8">bcrypt via passlib · intentionally slow · never plaintext</text>
  <text x="580" y="200" font-size="14" fill="#93c5fd">Refresh tokens:</text>
  <text x="678" y="200" font-size="14" fill="#94a3b8">SHA-256 hashed before DB storage</text>
  <text x="580" y="222" font-size="14" fill="#93c5fd">Access tokens:</text>
  <text x="672" y="222" font-size="14" fill="#94a3b8">Zustand memory only · never localStorage</text>
  <text x="580" y="256" font-size="13" fill="#6b7280">JWT HS256 · bcrypt · SHA-256 · httpOnly cookie</text>

  <!-- CARD: A03 Injection -->
  <rect x="1070" y="110" width="480" height="170" rx="16" fill="#1a1040" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="1070" y="110" width="480" height="44" rx="16" fill="#064e3b"/>
  <rect x="1070" y="136" width="480" height="18" fill="#064e3b"/>
  <rect x="1086" y="122" width="54" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="1113" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#6ee7b7">A03</text>
  <text x="1154" y="139" font-size="15" font-weight="700" fill="#e2d9f3">Injection</text>
  <rect x="1420" y="118" width="118" height="24" rx="12" fill="#065f46"/>
  <text x="1479" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="white">MITIGATED ✓</text>
  <text x="1090" y="178" font-size="14" fill="#6ee7b7">SQLAlchemy ORM:</text>
  <text x="1210" y="178" font-size="14" fill="#94a3b8">parameterised queries · no raw SQL</text>
  <text x="1090" y="200" font-size="14" fill="#6ee7b7">Pydantic v2:</text>
  <text x="1180" y="200" font-size="14" fill="#94a3b8">strict type coercion on all inputs</text>
  <text x="1090" y="222" font-size="14" fill="#6ee7b7">Regex blocks:</text>
  <text x="1190" y="222" font-size="14" fill="#94a3b8">&lt; &gt; " ' % ; ( ) &amp; in all text fields</text>
  <text x="1090" y="256" font-size="13" fill="#6b7280">ORM parameterisation · Pydantic validators · char-level blocks</text>

  <!-- CARD: A05 Security Misconfiguration -->
  <rect x="50" y="302" width="480" height="170" rx="16" fill="#1a1040" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="50" y="302" width="480" height="44" rx="16" fill="#78350f"/>
  <rect x="50" y="328" width="480" height="18" fill="#78350f"/>
  <rect x="66" y="314" width="54" height="24" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="93" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#fde68a">A05</text>
  <text x="134" y="331" font-size="15" font-weight="700" fill="#e2d9f3">Security Misconfiguration</text>
  <rect x="400" y="310" width="118" height="24" rx="12" fill="#92400e"/>
  <text x="459" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="white">ADDRESSED ✓</text>
  <text x="70" y="370" font-size="14" fill="#fbbf24">CORS whitelist:</text>
  <text x="172" y="370" font-size="14" fill="#94a3b8">ALLOWED_ORIGINS env var · no wildcard *</text>
  <text x="70" y="392" font-size="14" fill="#fbbf24">Security headers:</text>
  <text x="178" y="392" font-size="14" fill="#94a3b8">CSP, HSTS, X-Frame-Options, X-Content-Type</text>
  <text x="70" y="414" font-size="14" fill="#fbbf24">DEBUG=false:</text>
  <text x="170" y="414" font-size="14" fill="#94a3b8">required in production via env var</text>
  <text x="70" y="446" font-size="13" fill="#6b7280">vercel.json security headers · CORS exact match · no debug in prod</text>

  <!-- CARD: A07 Identification &amp; Auth Failures -->
  <rect x="560" y="302" width="480" height="170" rx="16" fill="#1a1040" stroke="#ec4899" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="560" y="302" width="480" height="44" rx="16" fill="#831843"/>
  <rect x="560" y="328" width="480" height="18" fill="#831843"/>
  <rect x="576" y="314" width="54" height="24" rx="6" fill="#831843" stroke="#ec4899" stroke-width="1"/>
  <text x="603" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#fbcfe8">A07</text>
  <text x="644" y="331" font-size="15" font-weight="700" fill="#e2d9f3">Auth Failures</text>
  <rect x="910" y="310" width="118" height="24" rx="12" fill="#9d174d"/>
  <text x="969" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="white">ADDRESSED ✓</text>
  <text x="580" y="370" font-size="14" fill="#f9a8d4">Rate limiting:</text>
  <text x="672" y="370" font-size="14" fill="#94a3b8">10 login/min, 5 register/min per IP</text>
  <text x="580" y="392" font-size="14" fill="#f9a8d4">Token rotation:</text>
  <text x="680" y="392" font-size="14" fill="#94a3b8">every refresh issues new pair, revokes old</text>
  <text x="580" y="414" font-size="14" fill="#f9a8d4">Reuse detection:</text>
  <text x="686" y="414" font-size="14" fill="#94a3b8">replayed token wipes all user sessions</text>
  <text x="580" y="446" font-size="13" fill="#6b7280">bcrypt · JWT · rotation · reuse detection · rate limiting</text>

  <!-- CARD: A09 Logging &amp; Monitoring -->
  <rect x="1070" y="302" width="480" height="170" rx="16" fill="#1a1040" stroke="#06b6d4" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="1070" y="302" width="480" height="44" rx="16" fill="#0c4a6e"/>
  <rect x="1070" y="328" width="480" height="18" fill="#0c4a6e"/>
  <rect x="1086" y="314" width="54" height="24" rx="6" fill="#0c4a6e" stroke="#06b6d4" stroke-width="1"/>
  <text x="1113" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#7dd3fc">A09</text>
  <text x="1154" y="331" font-size="15" font-weight="700" fill="#e2d9f3">Logging &amp; Monitoring</text>
  <rect x="1420" y="310" width="118" height="24" rx="12" fill="#075985"/>
  <text x="1479" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="white">ADDRESSED ✓</text>
  <text x="1090" y="370" font-size="14" fill="#7dd3fc">Request IDs:</text>
  <text x="1180" y="370" font-size="14" fill="#94a3b8">unique ID per request for tracing</text>
  <text x="1090" y="392" font-size="14" fill="#7dd3fc">Slow-request log:</text>
  <text x="1210" y="392" font-size="14" fill="#94a3b8">requests &gt; 500ms logged with details</text>
  <text x="1090" y="414" font-size="14" fill="#7dd3fc">Audit trail:</text>
  <text x="1172" y="414" font-size="14" fill="#94a3b8">ScenarioAttemptChoice records every decision</text>
  <text x="1090" y="446" font-size="13" fill="#6b7280">Request ID middleware · slow-request logging · full audit trail</text>

  <!-- ===== Bottom two rows: Additional controls ===== -->
  <!-- CORS whitelist detail -->
  <rect x="50" y="498" width="460" height="140" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="280" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">🌐 CORS Whitelist</text>
  <line x1="70" y1="536" x2="490" y2="536" stroke="#1f2937" stroke-width="1"/>
  <text x="70" y="560" font-size="13" fill="#94a3b8">ALLOWED_ORIGINS env var (no * wildcard)</text>
  <text x="70" y="582" font-size="13" fill="#4ade80">✓ http://localhost:5173 (dev)</text>
  <text x="70" y="604" font-size="13" fill="#4ade80">✓ https://your-app.vercel.app (prod)</text>
  <text x="70" y="626" font-size="13" fill="#94a3b8">Trailing slash breaks matching — documented</text>

  <!-- Rate limiting detail -->
  <rect x="530" y="498" width="460" height="140" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="760" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">⏱ Rate Limiting</text>
  <line x1="550" y1="536" x2="970" y2="536" stroke="#1f2937" stroke-width="1"/>
  <text x="550" y="560" font-size="13" fill="#94a3b8">In-memory sliding window per client IP</text>
  <text x="550" y="582" font-size="13" fill="#fde68a">Login: 10 requests / minute</text>
  <text x="550" y="604" font-size="13" fill="#fde68a">Register: 5 requests / minute</text>
  <text x="550" y="626" font-size="13" fill="#94a3b8">Returns 429 with Retry-After header</text>

  <!-- Security headers detail -->
  <rect x="1010" y="498" width="540" height="140" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="1280" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">🔒 Security Headers (vercel.json)</text>
  <line x1="1030" y1="536" x2="1530" y2="536" stroke="#1f2937" stroke-width="1"/>
  <text x="1040" y="558" font-size="13" fill="#4ade80">Content-Security-Policy</text>
  <text x="1040" y="578" font-size="13" fill="#4ade80">Strict-Transport-Security (HSTS)</text>
  <text x="1280" y="558" font-size="13" fill="#4ade80">X-Frame-Options: DENY</text>
  <text x="1280" y="578" font-size="13" fill="#4ade80">X-Content-Type-Options: nosniff</text>
  <text x="1040" y="600" font-size="13" fill="#4ade80">Referrer-Policy: strict-origin</text>
  <text x="1280" y="600" font-size="13" fill="#4ade80">Permissions-Policy</text>

  <!-- Summary badge bar -->
  <rect x="50" y="662" width="1500" height="100" rx="14" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>
  <text x="800" y="692" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Defence-in-depth: 9 independent security layers</text>
  <g font-size="13" text-anchor="middle">
    <rect x="70" y="704" width="120" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="130" y="722" fill="#4ade80">bcrypt</text>
    <rect x="202" y="704" width="110" height="28" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="257" y="722" fill="#a5b4fc">JWT HS256</text>
    <rect x="324" y="704" width="130" height="28" rx="8" fill="#78350f" stroke="#f97316" stroke-width="1"/>
    <text x="389" y="722" fill="#fb923c">httpOnly cookie</text>
    <rect x="466" y="704" width="130" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="531" y="722" fill="#4ade80">token rotation</text>
    <rect x="608" y="704" width="140" height="28" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="678" y="722" fill="#fca5a5">reuse detection</text>
    <rect x="760" y="704" width="130" height="28" rx="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
    <text x="825" y="722" fill="#99f6e4">ownership guard</text>
    <rect x="902" y="704" width="120" height="28" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="962" y="722" fill="#fde68a">rate limiting</text>
    <rect x="1034" y="704" width="120" height="28" rx="8" fill="#0c4a6e" stroke="#06b6d4" stroke-width="1"/>
    <text x="1094" y="722" fill="#7dd3fc">CORS whitelist</text>
    <rect x="1166" y="704" width="140" height="28" rx="8" fill="#292524" stroke="#78716c" stroke-width="1"/>
    <text x="1236" y="722" fill="#d6d3d1">sec headers</text>
    <rect x="1318" y="704" width="120" height="28" rx="8" fill="#1e293b" stroke="#6b7280" stroke-width="1"/>
    <text x="1378" y="722" fill="#9ca3af">Pydantic v2</text>
    <rect x="1450" y="704" width="80" height="28" rx="8" fill="#1e293b" stroke="#6b7280" stroke-width="1"/>
    <text x="1490" y="722" fill="#9ca3af">1MB cap</text>
  </g>

  <!-- Summary text -->
  <text x="800" y="790" text-anchor="middle" font-size="16" fill="#475569">No unmitigated OWASP Top 10 categories · All relevant risks addressed with documented controls</text>
</svg>
