<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Browser chrome -->
  <rect x="40" y="20" width="1520" height="860" rx="12" fill="#1e1e2e" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <!-- Browser top bar -->
  <rect x="40" y="20" width="1520" height="46" rx="12" fill="#111827"/>
  <rect x="40" y="48" width="1520" height="18" fill="#111827"/>
  <!-- Traffic lights -->
  <circle cx="78" cy="43" r="7" fill="#ef4444"/><circle cx="102" cy="43" r="7" fill="#f59e0b"/><circle cx="126" cy="43" r="7" fill="#22c55e"/>
  <!-- URL bar -->
  <rect x="200" y="30" width="800" height="28" rx="14" fill="#1f2937"/>
  <text x="600" y="49" text-anchor="middle" font-size="14" fill="#9ca3af">localhost:8000/docs</text>

  <!-- Swagger header -->
  <rect x="40" y="66" width="1520" height="80" fill="#1b5e20"/>
  <text x="80" y="98" font-size="28" font-weight="900" fill="white" font-family="Arial">FastAPI</text>
  <text x="80" y="126" font-size="16" fill="#a7f3d0">Skilio API — Scenario-Based Life Skills Platform</text>
  <!-- OAS badge -->
  <rect x="1290" y="78" width="230" height="50" rx="6" fill="#145a32" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1405" y="100" text-anchor="middle" font-size="12" fill="#6ee7b7">OAS 3.1</text>
  <text x="1405" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">27 endpoints  |  7 routers</text>

  <!-- ===== Column layout: left=groups, right=endpoint list ===== -->

  <!-- Left column: Group tags -->
  <rect x="58" y="162" width="320" height="724" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="78" y="190" font-size="14" font-weight="700" fill="#9ca3af">ENDPOINT GROUPS</text>

  <!-- Auth -->
  <rect x="68" y="202" width="300" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="90" y="225" font-size="15" font-weight="700" fill="#4ade80">/api/auth</text>
  <text x="90" y="242" font-size="12" fill="#6ee7b7">5 endpoints</text>
  <text x="350" y="231" text-anchor="end" font-size="20">▲</text>

  <!-- Children -->
  <rect x="68" y="256" width="300" height="46" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="279" font-size="15" font-weight="700" fill="#60a5fa">/api/children</text>
  <text x="90" y="296" font-size="12" fill="#93c5fd">9 endpoints</text>
  <text x="350" y="285" text-anchor="end" font-size="20" fill="#64748b">▶</text>

  <!-- Modules -->
  <rect x="68" y="310" width="300" height="46" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="333" font-size="15" font-weight="700" fill="#fbbf24">/api/modules</text>
  <text x="90" y="350" font-size="12" fill="#fde68a">2 endpoints</text>
  <text x="350" y="339" text-anchor="end" font-size="20" fill="#64748b">▶</text>

  <!-- Lessons -->
  <rect x="68" y="364" width="300" height="46" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="90" y="387" font-size="15" font-weight="700" fill="#a5b4fc">/api/lessons</text>
  <text x="90" y="404" font-size="12" fill="#c7d2fe">1 endpoint</text>
  <text x="350" y="393" text-anchor="end" font-size="20" fill="#64748b">▶</text>

  <!-- Scenarios -->
  <rect x="68" y="418" width="300" height="46" rx="8" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5"/>
  <text x="90" y="441" font-size="15" font-weight="700" fill="#d8b4fe">/api/scenarios</text>
  <text x="90" y="458" font-size="12" fill="#e9d5ff">5 endpoints</text>
  <text x="350" y="447" text-anchor="end" font-size="20" fill="#64748b">▶</text>

  <!-- Badges -->
  <rect x="68" y="472" width="300" height="46" rx="8" fill="#78350f" stroke="#fb923c" stroke-width="1.5"/>
  <text x="90" y="495" font-size="15" font-weight="700" fill="#fed7aa">/api/badges</text>
  <text x="90" y="512" font-size="12" fill="#fdba74">2 endpoints</text>
  <text x="350" y="501" text-anchor="end" font-size="20" fill="#64748b">▶</text>

  <!-- Users -->
  <rect x="68" y="526" width="300" height="46" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="549" font-size="15" font-weight="700" fill="#d1d5db">/api/users</text>
  <text x="90" y="566" font-size="12" fill="#9ca3af">3 endpoints</text>

  <!-- Health -->
  <rect x="68" y="580" width="300" height="46" rx="8" fill="#0f2a1e" stroke="#4ade80" stroke-width="1"/>
  <text x="90" y="603" font-size="15" font-weight="700" fill="#86efac">/health</text>
  <text x="90" y="620" font-size="12" fill="#6ee7b7">1 endpoint</text>

  <!-- ===== Right column: Auth endpoints expanded ===== -->
  <rect x="400" y="162" width="1142" height="724" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>

  <!-- Section header -->
  <rect x="400" y="162" width="1142" height="46" rx="10" fill="#064e3b"/>
  <rect x="400" y="190" width="1142" height="18" fill="#064e3b"/>
  <text x="428" y="192" font-size="16" font-weight="700" fill="#4ade80">/api/auth — Authentication</text>
  <text x="1510" y="192" text-anchor="end" font-size="14" fill="#6ee7b7">5 endpoints</text>

  <!-- Endpoint rows -->
  <!-- POST /register -->
  <rect x="418" y="222" width="1106" height="68" rx="8" fill="#0d2818" stroke="#064e3b" stroke-width="1"/>
  <rect x="428" y="238" width="74" height="24" rx="4" fill="#065f46"/>
  <text x="465" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">POST</text>
  <text x="520" y="252" font-size="16" font-weight="600" fill="#d1fae5">/api/auth/register</text>
  <text x="520" y="276" font-size="13" fill="#6ee7b7">Register a new parent account · Returns user object · 201 Created</text>
  <text x="1500" y="262" text-anchor="end" font-size="22" fill="#4ade80">▸</text>

  <!-- POST /login -->
  <rect x="418" y="298" width="1106" height="68" rx="8" fill="#0d2818" stroke="#064e3b" stroke-width="1"/>
  <rect x="428" y="314" width="74" height="24" rx="4" fill="#065f46"/>
  <text x="465" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">POST</text>
  <text x="520" y="328" font-size="16" font-weight="600" fill="#d1fae5">/api/auth/login</text>
  <text x="520" y="352" font-size="13" fill="#6ee7b7">Login · Returns access_token + sets httpOnly refresh cookie · 200 OK</text>
  <text x="1500" y="338" text-anchor="end" font-size="22" fill="#4ade80">▸</text>

  <!-- POST /refresh -->
  <rect x="418" y="374" width="1106" height="68" rx="8" fill="#0d2818" stroke="#064e3b" stroke-width="1"/>
  <rect x="428" y="390" width="74" height="24" rx="4" fill="#065f46"/>
  <text x="465" y="407" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">POST</text>
  <text x="520" y="404" font-size="16" font-weight="600" fill="#d1fae5">/api/auth/refresh</text>
  <text x="520" y="428" font-size="13" fill="#6ee7b7">Rotate refresh token → issue new access + refresh pair · 200 OK</text>
  <text x="1500" y="414" text-anchor="end" font-size="22" fill="#4ade80">▸</text>

  <!-- POST /logout -->
  <rect x="418" y="450" width="1106" height="68" rx="8" fill="#0d2818" stroke="#064e3b" stroke-width="1"/>
  <rect x="428" y="466" width="74" height="24" rx="4" fill="#065f46"/>
  <text x="465" y="483" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">POST</text>
  <text x="520" y="480" font-size="16" font-weight="600" fill="#d1fae5">/api/auth/logout</text>
  <text x="520" y="504" font-size="13" fill="#6ee7b7">Revoke current refresh token · 204 No Content</text>
  <text x="1500" y="490" text-anchor="end" font-size="22" fill="#4ade80">▸</text>

  <!-- GET /me -->
  <rect x="418" y="526" width="1106" height="68" rx="8" fill="#0d2a3e" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="428" y="542" width="64" height="24" rx="4" fill="#1e3a5f"/>
  <text x="460" y="559" text-anchor="middle" font-size="13" font-weight="700" fill="#60a5fa">GET</text>
  <text x="510" y="556" font-size="16" font-weight="600" fill="#bfdbfe">/api/auth/me</text>
  <text x="510" y="580" font-size="13" fill="#93c5fd">Get current authenticated user · Requires Bearer token · 200 OK</text>
  <text x="1500" y="566" text-anchor="end" font-size="22" fill="#60a5fa">▸</text>

  <!-- Example response expanded -->
  <rect x="418" y="602" width="1106" height="218" rx="8" fill="#0a0f1a" stroke="#1f2937" stroke-width="1"/>
  <text x="438" y="624" font-size="13" fill="#6b7280">Example Response — POST /api/auth/login · 200 OK</text>
  <line x1="418" y1="632" x2="1524" y2="632" stroke="#1f2937" stroke-width="1"/>
  <text x="450" y="658" font-size="14" fill="#4ade80" font-family="'Courier New', monospace">{"access_token":</text>
  <text x="620" y="658" font-size="14" fill="#fde68a" font-family="'Courier New', monospace">"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."</text>
  <text x="450" y="680" font-size="14" fill="#4ade80" font-family="'Courier New', monospace"> "token_type":</text>
  <text x="620" y="680" font-size="14" fill="#fde68a" font-family="'Courier New', monospace">"bearer"</text>
  <text x="450" y="702" font-size="14" fill="#6b7280" font-family="'Courier New', monospace"> // refresh token → httpOnly Set-Cookie header (not in body)</text>
  <text x="450" y="730" font-size="14" fill="#4ade80" font-family="'Courier New', monospace"> "user": {"id": 1, "email": "demo@skilio.com",</text>
  <text x="450" y="752" font-size="14" fill="#4ade80" font-family="'Courier New', monospace">         "full_name": "Demo Parent", "is_active": true}}</text>
  <rect x="428" y="784" width="220" height="28" rx="6" fill="#064e3b"/>
  <text x="538" y="803" text-anchor="middle" font-size="13" fill="#4ade80">✓ 200 OK  · 23ms</text>
  <rect x="660" y="784" width="200" height="28" rx="6" fill="#1e1b4b"/>
  <text x="760" y="803" text-anchor="middle" font-size="13" fill="#818cf8">🔒 JWT HS256</text>
  <rect x="872" y="784" width="220" height="28" rx="6" fill="#451a03"/>
  <text x="982" y="803" text-anchor="middle" font-size="13" fill="#fb923c">🍪 httpOnly cookie set</text>
</svg>
