    <rect x="1090" y="482" width="440" height="2" fill="#1e1b4b"/>

    <text x="1110" y="510">🗺</text><text x="1150" y="510" font-weight="700">More Story Worlds</text>
    <text x="1110" y="534" font-size="13" fill="#a5b4fc">Cyber Safety, Traffic, First Aid</text>
    <text x="1110" y="554" font-size="13" fill="#6b7280">Age-specific world variants</text>

    <rect x="1090" y="572" width="440" height="2" fill="#1e1b4b"/>

    <text x="1110" y="600">🎭</text><text x="1150" y="600" font-weight="700">Playwright E2E Tests</text>
    <text x="1110" y="624" font-size="13" fill="#a5b4fc">Browser automation test suite</text>
    <text x="1110" y="644" font-size="13" fill="#6b7280">Golden-path + edge-case coverage</text>

    <rect x="1090" y="662" width="440" height="2" fill="#1e1b4b"/>

    <text x="1110" y="690">📊</text><text x="1150" y="690" font-weight="700">Analytics Dashboard</text>
    <text x="1110" y="714" font-size="13" fill="#a5b4fc">Aggregate learning trends</text>
