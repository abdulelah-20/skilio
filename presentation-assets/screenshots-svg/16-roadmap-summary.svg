    <text x="600" y="464" font-size="13" fill="#94a3b8">Identify and patch known CVEs</text>

    <rect x="580" y="482" width="440" height="2" fill="#78350f"/>

    <text x="600" y="510">📸</text><text x="640" y="510" font-weight="700">Screenshot Proof Package</text>
