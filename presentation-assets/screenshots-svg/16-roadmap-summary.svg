    <text x="600" y="554" font-size="13" fill="#94a3b8">← You are here 😊</text>

    <rect x="580" y="572" width="440" height="2" fill="#78350f"/>

    <text x="600" y="600">🌍</text><text x="640" y="600" font-weight="700">More Scenario Content</text>
