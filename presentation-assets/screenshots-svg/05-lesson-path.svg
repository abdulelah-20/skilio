<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#060412"/>
    </radialGradient>
    <linearGradient id="xpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#818cf8" flood-opacity="0.6"/>
    </filter>
    <filter id="completedGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#4ade80" flood-opacity="0.5"/>
    </filter>
    <filter id="activeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.4">
    <circle cx="80" cy="60" r="1.5"/><circle cx="200" cy="40" r="1"/><circle cx="450" cy="80" r="2"/>
    <circle cx="700" cy="50" r="1.5"/><circle cx="950" cy="70" r="1"/><circle cx="1200" cy="45" r="2"/>
    <circle cx="1450" cy="75" r="1.5"/><circle cx="1550" cy="35" r="1"/>
  </g>

  <!-- ===== Top Navigation ===== -->
  <rect x="0" y="0" width="1600" height="88" fill="#0d0720"/>
  <rect x="0" y="86" width="1600" height="2" fill="#4c1d95"/>
  <!-- Back -->
  <text x="50" y="54" font-size="28" fill="#a78bfa">←</text>
  <text x="86" y="54" font-size="18" fill="#a78bfa">Worlds</text>
  <!-- World title -->
  <text x="800" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#c7d2fe">🌌  Outer Space</text>
  <text x="800" y="68" text-anchor="middle" font-size="15" fill="#818cf8">Safe routes vs risky shortcuts</text>
  <!-- Hero mini -->
  <circle cx="1490" cy="44" r="28" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="1490" y="52" text-anchor="middle" font-size="24">🚀</text>

  <!-- ===== XP / Level Bar ===== -->
  <rect x="80" y="108" width="1440" height="70" rx="14" fill="#0d0a20" stroke="#3730a3" stroke-width="1.5"/>
  <text x="120" y="135" font-size="14" fill="#818cf8">Level 2</text>
  <text x="120" y="162" font-size="12" fill="#6b7280">240 / 400 XP to Level 3</text>
  <rect x="220" y="128" width="1260" height="22" rx="11" fill="#1e1b4b"/>
  <rect x="220" y="128" width="756" height="22" rx="11" fill="url(#xpBar)"/>
  <text x="1500" y="148" text-anchor="middle" font-size="20" fill="#fde68a">⭐ 240</text>

  <!-- ===== Lesson Path ===== -->

  <!-- Connecting path line -->
  <path d="M 200 330 Q 400 330 400 420 Q 400 510 600 510 Q 800 510 800 420 Q 800 330 1000 330 Q 1200 330 1200 420 Q 1200 510 1400 510" stroke="#3730a3" stroke-width="4" fill="none" stroke-dasharray="12,6"/>

  <!-- LESSON 1: Completed -->
  <circle cx="200" cy="330" r="70" fill="#064e3b" stroke="#4ade80" stroke-width="3" filter="url(#completedGlow)"/>
  <text x="200" y="315" text-anchor="middle" font-size="36">🛸</text>
  <text x="200" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">✓ DONE</text>
  <!-- Card below node -->
  <rect x="100" y="416" width="200" height="130" rx="14" fill="#065f46" stroke="#4ade80" stroke-width="1.5"/>
  <text x="200" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7b7">Lesson 1</text>
  <text x="200" y="464" text-anchor="middle" font-size="13" fill="#a7f3d0">Launch Prep</text>
  <text x="200" y="484" text-anchor="middle" font-size="13" fill="#a7f3d0">Safe vs risky routes</text>
  <rect x="130" y="498" width="140" height="30" rx="15" fill="#4ade80"/>
  <text x="200" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#052e16">+50 XP earned</text>

  <!-- LESSON 2: Completed -->
  <circle cx="600" cy="510" r="70" fill="#064e3b" stroke="#4ade80" stroke-width="3" filter="url(#completedGlow)"/>
  <text x="600" y="495" text-anchor="middle" font-size="36">🌙</text>
  <text x="600" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">✓ DONE</text>
  <rect x="500" y="596" width="200" height="130" rx="14" fill="#065f46" stroke="#4ade80" stroke-width="1.5"/>
  <text x="600" y="624" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7b7">Lesson 2</text>
  <text x="600" y="644" text-anchor="middle" font-size="13" fill="#a7f3d0">Moon Mission</text>
  <text x="600" y="664" text-anchor="middle" font-size="13" fill="#a7f3d0">Asking for help</text>
  <rect x="532" y="678" width="136" height="30" rx="15" fill="#4ade80"/>
  <text x="600" y="698" text-anchor="middle" font-size="13" font-weight="700" fill="#052e16">+75 XP earned</text>

  <!-- LESSON 3: ACTIVE (current) -->
  <circle cx="1000" cy="330" r="78" fill="#1e1b4b" stroke="#f59e0b" stroke-width="4" filter="url(#activeGlow)"/>
  <!-- Pulse ring -->
  <circle cx="1000" cy="330" r="88" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <text x="1000" y="315" text-anchor="middle" font-size="36">⚡</text>
  <text x="1000" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">CURRENT</text>
  <rect x="890" y="416" width="220" height="140" rx="14" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1000" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">Lesson 3</text>
  <text x="1000" y="464" text-anchor="middle" font-size="13" fill="#e2d9f3">Space Station Safety</text>
  <text x="1000" y="484" text-anchor="middle" font-size="13" fill="#e2d9f3">Emergency decisions</text>
  <rect x="920" y="500" width="160" height="38" rx="19" fill="#f59e0b"/>
  <text x="1000" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#1a0a00">▶  Play Now</text>

  <!-- LESSON 4: Locked -->
  <circle cx="1400" cy="510" r="70" fill="#1a1a2e" stroke="#374151" stroke-width="2"/>
  <text x="1400" y="495" text-anchor="middle" font-size="36">🔒</text>
  <text x="1400" y="532" text-anchor="middle" font-size="13" fill="#4b5563">LOCKED</text>
  <rect x="1300" y="596" width="200" height="130" rx="14" fill="#0f0f1a" stroke="#374151" stroke-width="1"/>
  <text x="1400" y="624" text-anchor="middle" font-size="15" font-weight="700" fill="#6b7280">Lesson 4</text>
  <text x="1400" y="644" text-anchor="middle" font-size="13" fill="#4b5563">Asteroid Belt</text>
  <text x="1400" y="664" text-anchor="middle" font-size="13" fill="#4b5563">Complete Lesson 3</text>
  <text x="1400" y="684" text-anchor="middle" font-size="13" fill="#4b5563">to unlock</text>

  <!-- More lessons off-screen hint -->
  <text x="800" y="860" text-anchor="middle" font-size="16" fill="#4c1d95">+ 3 more lessons to unlock · Complete all 6 to earn the Space Explorer badge 🏅</text>

  <!-- Legend -->
  <rect x="80" y="830" width="240" height="50" rx="10" fill="#0d0a20" stroke="#374151" stroke-width="1"/>
  <circle cx="110" cy="855" r="10" fill="#064e3b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="128" y="860" font-size="13" fill="#6ee7b7">Completed</text>
  <circle cx="220" cy="855" r="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="238" y="860" font-size="13" fill="#fde68a">Current</text>
  <circle cx="320" cy="855" r="10" fill="#1a1a2e" stroke="#374151" stroke-width="1.5"/>
  <text x="338" y="860" font-size="13" fill="#6b7280">Locked</text>
</svg>
