<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="frontendLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="backendLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="ormLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="dbLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <marker id="arrowDown" markerWidth="12" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#7c3aed"/>
    </marker>
    <filter id="layerShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="54" text-anchor="middle" font-size="38" font-weight="800" fill="#e2e8f0">Skilio — System Architecture</text>
  <line x1="300" y1="72" x2="1300" y2="72" stroke="#4c1d95" stroke-width="1.5"/>

  <!-- ===== Left: Layer diagram ===== -->

  <!-- Layer 1: Browser (React) -->
  <rect x="60" y="100" width="900" height="150" rx="18" fill="url(#frontendLayer)" stroke="#3b82f6" stroke-width="2" filter="url(#layerShadow)"/>
  <text x="100" y="138" font-size="22" font-weight="700" fill="#93c5fd">🖥  Browser</text>
  <text x="100" y="165" font-size="16" fill="#60a5fa" font-weight="600">React 18 + Vite 5 + TypeScript 5 + Tailwind CSS 3</text>
  <g fill="#94a3b8" font-size="14">
    <text x="100" y="192">Zustand 4 auth store</text>
    <text x="290" y="192">·  TanStack Query 5</text>
    <text x="490" y="192">·  React Router v6</text>
    <text x="680" y="192">·  Axios + 401 interceptor</text>
  </g>
  <!-- Tech pill labels -->
  <rect x="100" y="210" width="86" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="143" y="226" text-anchor="middle" font-size="11" fill="#93c5fd">React 18</text>
  <rect x="196" y="210" width="80" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="236" y="226" text-anchor="middle" font-size="11" fill="#93c5fd">Vite 5</text>
  <rect x="286" y="210" width="110" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="341" y="226" text-anchor="middle" font-size="11" fill="#93c5fd">TypeScript 5</text>
  <rect x="406" y="210" width="100" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="456" y="226" text-anchor="middle" font-size="11" fill="#93c5fd">Tailwind 3</text>

  <!-- Arrow 1→2 -->
  <line x1="510" y1="252" x2="510" y2="294" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowDown)"/>
  <rect x="430" y="256" width="160" height="28" rx="14" fill="#0f0a2e"/>
  <text x="510" y="275" text-anchor="middle" font-size="13" fill="#a78bfa">Axios /api/* requests</text>

  <!-- Layer 2: Vite/nginx Proxy -->
  <rect x="60" y="296" width="900" height="80" rx="14" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
  <text x="100" y="328" font-size="18" font-weight="700" fill="#9ca3af">🔀  Proxy</text>
  <text x="100" y="356" font-size="14" fill="#6b7280">Vite dev proxy (dev)  ·  nginx (prod)  ·  /api/* → FastAPI:8000  ·  SPA fallback</text>

  <!-- Arrow 2→3 -->
  <line x1="510" y1="378" x2="510" y2="418" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowDown)"/>
  <rect x="440" y="382" width="140" height="28" rx="14" fill="#0f0a2e"/>
  <text x="510" y="401" text-anchor="middle" font-size="13" fill="#a78bfa">HTTP/HTTPS</text>

  <!-- Layer 3: FastAPI Backend -->
  <rect x="60" y="420" width="900" height="150" rx="18" fill="url(#backendLayer)" stroke="#10b981" stroke-width="2" filter="url(#layerShadow)"/>
  <text x="100" y="458" font-size="22" font-weight="700" fill="#6ee7b7">⚡  FastAPI Backend</text>
  <text x="100" y="484" font-size="16" fill="#4ade80" font-weight="600">Python 3.11  ·  uvicorn  ·  Pydantic v2  ·  7 routers  ·  27 endpoints</text>
  <g fill="#94a3b8" font-size="14">
    <text x="100" y="510">CORS middleware</text>
    <text x="260" y="510">·  Rate limiting</text>
    <text x="390" y="510">·  Size limits</text>
    <text x="500" y="510">·  Request ID</text>
    <text x="620" y="510">·  Depends() injection</text>
  </g>
  <rect x="100" y="525" width="86" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="143" y="541" text-anchor="middle" font-size="11" fill="#6ee7b7">FastAPI</text>
  <rect x="196" y="525" width="70" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="231" y="541" text-anchor="middle" font-size="11" fill="#6ee7b7">JWT HS256</text>
  <rect x="276" y="525" width="74" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="313" y="541" text-anchor="middle" font-size="11" fill="#6ee7b7">bcrypt</text>
  <rect x="360" y="525" width="110" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="415" y="541" text-anchor="middle" font-size="11" fill="#6ee7b7">Pydantic v2</text>

  <!-- Arrow 3→4 -->
  <line x1="510" y1="572" x2="510" y2="614" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowDown)"/>
  <rect x="430" y="576" width="160" height="28" rx="14" fill="#0f0a2e"/>
  <text x="510" y="595" text-anchor="middle" font-size="13" fill="#a78bfa">SQLAlchemy ORM</text>

  <!-- Layer 4: ORM + Alembic -->
  <rect x="60" y="616" width="900" height="80" rx="14" fill="url(#ormLayer)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="648" font-size="18" font-weight="700" fill="#fde68a">🗄  SQLAlchemy 2.0 + Alembic</text>
  <text x="100" y="672" font-size="14" fill="#fbbf24">13 entities  ·  Mapped[] type annotations  ·  Relationships  ·  Migrations</text>

  <!-- Arrow 4→5 -->
  <line x1="510" y1="698" x2="510" y2="738" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowDown)"/>
  <rect x="438" y="702" width="144" height="28" rx="14" fill="#0f0a2e"/>
  <text x="510" y="721" text-anchor="middle" font-size="13" fill="#a78bfa">DATABASE_URL</text>

  <!-- Layer 5: Database -->
  <rect x="60" y="740" width="900" height="90" rx="14" fill="url(#dbLayer)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="100" y="775" font-size="18" font-weight="700" fill="#c7d2fe">🐘  Database</text>
  <text x="100" y="800" font-size="14" fill="#a5b4fc">SQLite (dev, zero config)  ·  MySQL  ·  PostgreSQL  ·  Switched via DATABASE_URL env var only</text>

  <!-- ===== Right column: Key metrics / annotations ===== -->

  <!-- Stats grid -->
  <rect x="1010" y="100" width="540" height="330" rx="18" fill="#111827" stroke="#1f2937" stroke-width="1" filter="url(#layerShadow)"/>
  <text x="1030" y="134" font-size="18" font-weight="700" fill="#94a3b8">By the Numbers</text>
  <line x1="1030" y1="146" x2="1530" y2="146" stroke="#1f2937" stroke-width="1"/>

  <!-- Stat items -->
  <g font-size="15">
    <text x="1040" y="182" fill="#6b7280">Database entities</text>
    <text x="1520" y="182" text-anchor="end" font-size="26" font-weight="800" fill="#a78bfa">13</text>

    <text x="1040" y="220" fill="#6b7280">API endpoints</text>
    <text x="1520" y="220" text-anchor="end" font-size="26" font-weight="800" fill="#10b981">27</text>

    <text x="1040" y="258" fill="#6b7280">API routers</text>
    <text x="1520" y="258" text-anchor="end" font-size="26" font-weight="800" fill="#3b82f6">7</text>

    <text x="1040" y="296" fill="#6b7280">Pytest tests</text>
    <text x="1520" y="296" text-anchor="end" font-size="26" font-weight="800" fill="#4ade80">42</text>

    <text x="1040" y="334" fill="#6b7280">Story worlds</text>
    <text x="1520" y="334" text-anchor="end" font-size="26" font-weight="800" fill="#f59e0b">3</text>

    <text x="1040" y="372" fill="#6b7280">Target age range</text>
    <text x="1520" y="372" text-anchor="end" font-size="22" font-weight="800" fill="#ec4899">4–17</text>
  </g>

  <!-- Scenario DAG Engine box -->
  <rect x="1010" y="452" width="540" height="200" rx="18" fill="#2d1b69" stroke="#7c3aed" stroke-width="2" filter="url(#layerShadow)"/>
  <text x="1030" y="486" font-size="18" font-weight="700" fill="#c4b5fd">🔁 Scenario DAG Engine</text>
  <line x1="1030" y1="498" x2="1530" y2="498" stroke="#4c1d95" stroke-width="1"/>
  <text x="1040" y="526" font-size="14" fill="#a78bfa">ScenarioNode → ScenarioChoice → next_node_id</text>
  <text x="1040" y="552" font-size="14" fill="#a78bfa">Self-referential directed acyclic graph</text>
  <text x="1040" y="578" font-size="14" fill="#a78bfa">Full audit: ScenarioAttemptChoice records every pick</text>
  <text x="1040" y="604" font-size="14" fill="#a78bfa">Idempotent resume: re-start = continue same attempt</text>
  <text x="1040" y="630" font-size="14" fill="#a78bfa">Completion triggers XP award + badge check</text>

  <!-- Auth Flow summary -->
  <rect x="1010" y="674" width="540" height="156" rx="18" fill="#1e1040" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="1030" y="708" font-size="18" font-weight="700" fill="#c4b5fd">🔐 Auth Design</text>
  <line x1="1030" y1="718" x2="1530" y2="718" stroke="#4c1d95" stroke-width="1"/>
  <text x="1040" y="744" font-size="14" fill="#a78bfa">Access token: JWT HS256  ·  30 min  ·  Zustand memory</text>
  <text x="1040" y="768" font-size="14" fill="#a78bfa">Refresh token: JWT  ·  7 days  ·  httpOnly cookie</text>
  <text x="1040" y="792" font-size="14" fill="#a78bfa">Rotation + reuse detection → wipe all tokens</text>
  <text x="1040" y="816" font-size="14" fill="#a78bfa">Child ownership guard on every child route</text>
</svg>
