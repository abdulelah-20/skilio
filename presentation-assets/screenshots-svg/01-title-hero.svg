<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="50%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#060412"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>
    <radialGradient id="planet2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#120a30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="400" rx="600" ry="400" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.8">
    <circle cx="80" cy="60" r="1.5"/><circle cx="150" cy="120" r="1"/><circle cx="220" cy="45" r="2"/>
    <circle cx="350" cy="90" r="1.5"/><circle cx="480" cy="30" r="1"/><circle cx="560" cy="110" r="2"/>
    <circle cx="700" cy="55" r="1.5"/><circle cx="820" cy="25" r="1"/><circle cx="950" cy="80" r="2"/>
    <circle cx="1100" cy="40" r="1.5"/><circle cx="1200" cy="100" r="1"/><circle cx="1320" cy="60" r="2"/>
    <circle cx="1450" cy="30" r="1.5"/><circle cx="1530" cy="90" r="1"/>
    <circle cx="100" cy="200" r="1"/><circle cx="200" cy="280" r="1.5"/><circle cx="1400" cy="180" r="1"/>
    <circle cx="1500" cy="250" r="1.5"/><circle cx="50" cy="350" r="1"/><circle cx="1550" cy="400" r="2"/>
    <circle cx="120" cy="500" r="1.5"/><circle cx="1480" cy="550" r="1"/><circle cx="60" cy="700" r="2"/>
    <circle cx="1540" cy="650" r="1.5"/><circle cx="90" cy="820" r="1"/><circle cx="1510" cy="780" r="1.5"/>
    <circle cx="400" cy="820" r="1"/><circle cx="600" cy="860" r="1.5"/><circle cx="900" cy="840" r="1"/>
    <circle cx="1100" cy="870" r="2"/><circle cx="1300" cy="810" r="1"/>
  </g>
  <!-- Twinkling larger stars -->
  <g fill="white">
    <circle cx="160" cy="160" r="2.5" opacity="0.9"/><circle cx="440" cy="200" r="2" opacity="0.7"/>
    <circle cx="1250" cy="150" r="2.5" opacity="0.8"/><circle cx="1380" cy="220" r="2" opacity="0.9"/>
    <circle cx="75" cy="450" r="2" opacity="0.7"/><circle cx="1520" cy="480" r="2.5" opacity="0.8"/>
  </g>

  <!-- Planet (top-left) -->
  <circle cx="180" cy="140" r="55" fill="url(#planet1)" opacity="0.7"/>
  <ellipse cx="180" cy="140" rx="90" ry="15" fill="none" stroke="#86efac" stroke-width="3" opacity="0.5" transform="rotate(-20 180 140)"/>

  <!-- Planet (top-right) -->
  <circle cx="1420" cy="120" r="40" fill="url(#planet2)" opacity="0.6"/>

  <!-- Moon (bottom-left) -->
  <circle cx="130" cy="760" r="35" fill="#f3e68a" opacity="0.4"/>
  <circle cx="148" cy="748" r="35" fill="#0f0a2e" opacity="0.4"/>

  <!-- Forest leaves (bottom-right) -->
  <g opacity="0.5" transform="translate(1380, 780)">
    <ellipse cx="0" cy="0" rx="30" ry="60" fill="#22c55e" transform="rotate(-20)"/>
    <ellipse cx="40" cy="10" rx="25" ry="50" fill="#16a34a" transform="rotate(10)"/>
    <ellipse cx="-35" cy="5" rx="20" ry="45" fill="#4ade80" transform="rotate(-35)"/>
  </g>
  <!-- Ocean bubbles (bottom-left) -->
  <g opacity="0.4">
    <circle cx="240" cy="820" r="18" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="290" cy="800" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="260" cy="850" r="8" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="320" cy="830" r="22" fill="none" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Central glow plate -->
  <ellipse cx="800" cy="420" rx="500" ry="280" fill="#4c1d95" opacity="0.15"/>

  <!-- World emoji row -->
  <text x="800" y="230" text-anchor="middle" font-size="64" filter="url(#textGlow)">🌌  🌊  🌲</text>

  <!-- SKILIO title -->
  <text x="800" y="370" text-anchor="middle" font-size="130" font-weight="900" fill="url(#titleGrad)" filter="url(#shadow)" letter-spacing="12">SKILIO</text>

  <!-- Subtitle -->
  <text x="800" y="430" text-anchor="middle" font-size="26" fill="#c4b5fd" letter-spacing="2" font-weight="300">Scenario-Based Life Skills Learning Platform for Children</text>

  <!-- Divider line -->
  <line x1="500" y1="460" x2="1100" y2="460" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>

  <!-- Tech badges -->
  <g transform="translate(800, 520)">
    <!-- FastAPI -->
    <rect x="-530" y="-22" width="140" height="44" rx="22" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="-460" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#6ee7b7">⚡ FastAPI</text>
    <!-- React -->
    <rect x="-370" y="-22" width="120" height="44" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-310" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#7dd3fc">⚛ React</text>
    <!-- SQLAlchemy -->
    <rect x="-230" y="-22" width="170" height="44" rx="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="-145" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#a5b4fc">🗄 SQLAlchemy</text>
    <!-- JWT -->
    <rect x="-40" y="-22" width="100" height="44" rx="22" fill="#451a03" stroke="#fb923c" stroke-width="1.5"/>
    <text x="10" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fed7aa">🔐 JWT</text>
    <!-- Pytest -->
    <rect x="80" y="-22" width="120" height="44" rx="22" fill="#1a1a2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="140" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#d8b4fe">✅ Pytest</text>
    <!-- TypeScript -->
    <rect x="220" y="-22" width="160" height="44" rx="22" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="300" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#93c5fd">📘 TypeScript</text>
    <!-- CI/CD -->
    <rect x="400" y="-22" width="120" height="44" rx="22" fill="#1c1917" stroke="#d4d4aa" stroke-width="1.5"/>
    <text x="460" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">🚀 CI/CD</text>
  </g>

  <!-- Bottom tagline -->
  <text x="800" y="650" text-anchor="middle" font-size="19" fill="#6d28d9" opacity="0.9" font-style="italic">Children navigate branching story worlds and make real safety decisions.</text>
  <text x="800" y="680" text-anchor="middle" font-size="19" fill="#6d28d9" opacity="0.9" font-style="italic">Parents track every choice in real time.</text>

  <!-- Bottom ornament -->
  <g opacity="0.3" transform="translate(800,770)">
    <circle cx="0" cy="0" r="4" fill="#a78bfa"/>
    <circle cx="-30" cy="0" r="3" fill="#a78bfa"/>
    <circle cx="30" cy="0" r="3" fill="#a78bfa"/>
    <circle cx="-55" cy="0" r="2" fill="#a78bfa"/>
    <circle cx="55" cy="0" r="2" fill="#a78bfa"/>
  </g>
</svg>
