<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e0a4e"/>
      <stop offset="100%" stop-color="#060314"/>
    </radialGradient>
    <linearGradient id="spaceCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <linearGradient id="seaCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="forestCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="progressBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="progressBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="progressBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardGlow1">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#818cf8" flood-opacity="0.4"/>
    </filter>
    <filter id="cardGlow2">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
    <filter id="cardGlow3">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#4ade80" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.5">
    <circle cx="100" cy="80" r="1.5"/><circle cx="250" cy="50" r="1"/><circle cx="500" cy="90" r="2"/>
    <circle cx="750" cy="40" r="1"/><circle cx="1000" cy="75" r="1.5"/><circle cx="1250" cy="55" r="2"/>
    <circle cx="1500" cy="85" r="1"/><circle cx="180" cy="150" r="1"/><circle cx="1420" cy="160" r="1.5"/>
    <circle cx="60" cy="400" r="1"/><circle cx="1540" cy="380" r="1.5"/>
    <circle cx="80" cy="820" r="1.5"/><circle cx="1520" cy="800" r="1"/>
  </g>

  <!-- ===== Top Navigation Bar ===== -->
  <rect x="0" y="0" width="1600" height="90" fill="#0d0720"/>
  <rect x="0" y="88" width="1600" height="2" fill="#4c1d95"/>

  <!-- Logo -->
  <text x="60" y="58" font-size="32" font-weight="900" fill="#a78bfa">SKILIO</text>
  <text x="60" y="80" font-size="13" fill="#6b5fa0">Life Skills Platform</text>

  <!-- XP display -->
  <rect x="520" y="20" width="160" height="52" rx="26" fill="#1a1040" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="600" y="43" text-anchor="middle" font-size="13" fill="#a78bfa">Total XP</text>
  <text x="600" y="64" text-anchor="middle" font-size="20" font-weight="800" fill="#fde68a">⭐ 240</text>

  <!-- Streak -->
  <rect x="700" y="20" width="150" height="52" rx="26" fill="#1a1040" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="775" y="43" text-anchor="middle" font-size="13" fill="#a78bfa">Streak</text>
  <text x="775" y="64" text-anchor="middle" font-size="20" font-weight="800" fill="#f97316">🔥 3 days</text>

  <!-- Hero indicator -->
  <rect x="868" y="20" width="200" height="52" rx="26" fill="#1a1040" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="930" y="48" font-size="28">🚀</text>
  <text x="968" y="43" font-size="13" fill="#a78bfa">Hero</text>
  <text x="968" y="64" font-size="16" font-weight="700" fill="#fde68a">Nova</text>

  <!-- Profile avatar -->
  <circle cx="1520" cy="44" r="30" fill="#4c1d95" stroke="#7c3aed" stroke-width="2"/>
  <text x="1520" y="52" text-anchor="middle" font-size="26">👦</text>

  <!-- Settings -->
  <text x="1458" y="52" text-anchor="middle" font-size="28" fill="#6b5fa0">⚙</text>

  <!-- ===== Page Heading ===== -->
  <text x="800" y="155" text-anchor="middle" font-size="48" font-weight="900" fill="#e2d9f3">Choose your world</text>
  <text x="800" y="192" text-anchor="middle" font-size="20" fill="#8b5cf6">Each world holds unique challenges and life lessons</text>

  <!-- ===== World Cards ===== -->

  <!-- CARD 1: Outer Space (active/in-progress) -->
  <rect x="60" y="220" width="466" height="560" rx="28" fill="url(#spaceCard)" stroke="#818cf8" stroke-width="2" filter="url(#cardGlow1)"/>
  <!-- Banner -->
  <rect x="60" y="220" width="466" height="60" rx="28" fill="#3730a3"/>
  <rect x="60" y="250" width="466" height="30" fill="#3730a3"/>
  <text x="293" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#c7d2fe">🌌  OUTER SPACE</text>
  <!-- Big emoji -->
  <text x="293" y="370" text-anchor="middle" font-size="130">🚀</text>
  <!-- Title -->
  <text x="293" y="450" text-anchor="middle" font-size="32" font-weight="800" fill="#c7d2fe">Outer Space</text>
  <text x="293" y="484" text-anchor="middle" font-size="16" fill="#818cf8">Safe routes vs risky shortcuts</text>
  <!-- Progress badge -->
  <rect x="220" y="505" width="146" height="30" rx="15" fill="#4338ca" stroke="#818cf8" stroke-width="1"/>
  <text x="293" y="525" text-anchor="middle" font-size="14" fill="#a5b4fc">2 / 6 lessons</text>
  <!-- Progress bar -->
  <rect x="100" y="548" width="386" height="14" rx="7" fill="#1e1b4b"/>
  <rect x="100" y="548" width="129" height="14" rx="7" fill="url(#progressBar1)"/>
  <text x="293" y="582" text-anchor="middle" font-size="13" fill="#818cf8">33% complete</text>
  <!-- Lesson dots -->
  <g transform="translate(293, 620)">
    <circle cx="-120" cy="0" r="14" fill="#818cf8"/><text x="-120" y="5" text-anchor="middle" font-size="11" fill="white">✓</text>
    <circle cx="-70" cy="0" r="14" fill="#818cf8"/><text x="-70" y="5" text-anchor="middle" font-size="11" fill="white">✓</text>
    <circle cx="-20" cy="0" r="14" fill="#4338ca" stroke="#818cf8" stroke-width="2"/><text x="-20" y="5" text-anchor="middle" font-size="14" fill="#a5b4fc">▶</text>
    <circle cx="30" cy="0" r="14" fill="#1e1b4b" stroke="#374151" stroke-width="2"/><text x="30" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="80" cy="0" r="14" fill="#1e1b4b" stroke="#374151" stroke-width="2"/><text x="80" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="130" cy="0" r="14" fill="#1e1b4b" stroke="#374151" stroke-width="2"/><text x="130" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
  </g>
  <!-- Play button -->
  <rect x="160" y="682" width="266" height="60" rx="30" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
  <text x="293" y="719" text-anchor="middle" font-size="20" font-weight="700" fill="white">▶  Continue</text>

  <!-- CARD 2: Deep Sea -->
  <rect x="567" y="220" width="466" height="560" rx="28" fill="url(#seaCard)" stroke="#38bdf8" stroke-width="2" filter="url(#cardGlow2)"/>
  <rect x="567" y="220" width="466" height="60" rx="28" fill="#075985"/>
  <rect x="567" y="250" width="466" height="30" fill="#075985"/>
  <text x="800" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">🌊  THE DEEP SEA</text>
  <text x="800" y="370" text-anchor="middle" font-size="130">🐙</text>
  <text x="800" y="450" text-anchor="middle" font-size="32" font-weight="800" fill="#bae6fd">The Deep Sea</text>
  <text x="800" y="484" text-anchor="middle" font-size="16" fill="#38bdf8">Stranger danger, asking for help</text>
  <rect x="726" y="505" width="148" height="30" rx="15" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
  <text x="800" y="525" text-anchor="middle" font-size="14" fill="#7dd3fc">0 / 6 lessons</text>
  <rect x="607" y="548" width="386" height="14" rx="7" fill="#0c4a6e"/>
  <text x="800" y="582" text-anchor="middle" font-size="13" fill="#38bdf8">Not started</text>
  <g transform="translate(800, 620)">
    <circle cx="-120" cy="0" r="14" fill="#0c4a6e" stroke="#374151" stroke-width="2"/><text x="-120" y="5" text-anchor="middle" font-size="14" fill="#38bdf8">▶</text>
    <circle cx="-70" cy="0" r="14" fill="#0c4a6e" stroke="#374151" stroke-width="2"/><text x="-70" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="-20" cy="0" r="14" fill="#0c4a6e" stroke="#374151" stroke-width="2"/><text x="-20" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="30" cy="0" r="14" fill="#0c4a6e" stroke="#374151" stroke-width="2"/><text x="30" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="80" cy="0" r="14" fill="#0c4a6e" stroke="#374151" stroke-width="2"/><text x="80" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="130" cy="0" r="14" fill="#0c4a6e" stroke="#374151" stroke-width="2"/><text x="130" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
  </g>
  <rect x="668" y="682" width="264" height="60" rx="30" fill="#075985" stroke="#38bdf8" stroke-width="2"/>
  <text x="800" y="719" text-anchor="middle" font-size="20" font-weight="700" fill="white">▶  Start</text>

  <!-- CARD 3: Enchanted Forest -->
  <rect x="1074" y="220" width="466" height="560" rx="28" fill="url(#forestCard)" stroke="#4ade80" stroke-width="2" filter="url(#cardGlow3)"/>
  <rect x="1074" y="220" width="466" height="60" rx="28" fill="#166534"/>
  <rect x="1074" y="250" width="466" height="30" fill="#166534"/>
  <text x="1307" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#bbf7d0">🌲  ENCHANTED FOREST</text>
  <text x="1307" y="370" text-anchor="middle" font-size="130">🧚</text>
  <text x="1307" y="450" text-anchor="middle" font-size="32" font-weight="800" fill="#bbf7d0">Enchanted Forest</text>
  <text x="1307" y="484" text-anchor="middle" font-size="16" fill="#4ade80">Trusted adults, fire safety</text>
  <rect x="1228" y="505" width="158" height="30" rx="15" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="1307" y="525" text-anchor="middle" font-size="14" fill="#86efac">0 / 6 lessons</text>
  <rect x="1114" y="548" width="386" height="14" rx="7" fill="#14532d"/>
  <text x="1307" y="582" text-anchor="middle" font-size="13" fill="#4ade80">Not started</text>
  <g transform="translate(1307, 620)">
    <circle cx="-120" cy="0" r="14" fill="#14532d" stroke="#374151" stroke-width="2"/><text x="-120" y="5" text-anchor="middle" font-size="14" fill="#4ade80">▶</text>
    <circle cx="-70" cy="0" r="14" fill="#14532d" stroke="#374151" stroke-width="2"/><text x="-70" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="-20" cy="0" r="14" fill="#14532d" stroke="#374151" stroke-width="2"/><text x="-20" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="30" cy="0" r="14" fill="#14532d" stroke="#374151" stroke-width="2"/><text x="30" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="80" cy="0" r="14" fill="#14532d" stroke="#374151" stroke-width="2"/><text x="80" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
    <circle cx="130" cy="0" r="14" fill="#14532d" stroke="#374151" stroke-width="2"/><text x="130" y="5" text-anchor="middle" font-size="11" fill="#4b5563">🔒</text>
  </g>
  <rect x="1174" y="682" width="266" height="60" rx="30" fill="#166534" stroke="#4ade80" stroke-width="2"/>
  <text x="1307" y="719" text-anchor="middle" font-size="20" font-weight="700" fill="white">▶  Start</text>

  <!-- Bottom bar -->
  <rect x="0" y="838" width="1600" height="62" fill="#0d0720"/>
  <text x="800" y="876" text-anchor="middle" font-size="16" fill="#4c1d95">Ages 4–17 · 3 worlds · 18 lessons · Earn badges as you learn</text>
</svg>
