<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f0e2e"/>
      <stop offset="70%" stop-color="#06041a"/>
      <stop offset="100%" stop-color="#02010c"/>
    </radialGradient>
    <linearGradient id="storyCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#13104a"/>
    </linearGradient>
    <linearGradient id="choiceA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="choiceB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="choiceC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="storyGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#4c1d95" flood-opacity="0.5"/>
    </filter>
    <filter id="choiceHover">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Space background elements -->
  <g opacity="0.5">
    <circle cx="100" cy="100" r="1.5" fill="white"/><circle cx="300" cy="60" r="1" fill="white"/>
    <circle cx="500" cy="130" r="2" fill="white"/><circle cx="800" cy="50" r="1.5" fill="white"/>
    <circle cx="1100" cy="90" r="1" fill="white"/><circle cx="1350" cy="55" r="2" fill="white"/>
    <circle cx="1500" cy="120" r="1.5" fill="white"/><circle cx="1550" cy="800" r="1" fill="white"/>
    <circle cx="80" cy="700" r="1.5" fill="white"/><circle cx="1480" cy="750" r="2" fill="white"/>
    <!-- Nebula cloud -->
    <ellipse cx="1400" cy="200" rx="180" ry="80" fill="#4c1d95" opacity="0.15"/>
    <ellipse cx="200" cy="750" rx="150" ry="60" fill="#0c4a6e" opacity="0.15"/>
  </g>
  <!-- Planet decoration -->
  <circle cx="1480" cy="160" r="60" fill="#1e3a5f" opacity="0.5"/>
  <ellipse cx="1480" cy="160" rx="95" ry="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" transform="rotate(-15 1480 160)"/>

  <!-- ===== Top Bar ===== -->
  <rect x="0" y="0" width="1600" height="78" fill="#0d0720" opacity="0.95"/>
  <rect x="0" y="76" width="1600" height="2" fill="#4c1d95"/>
  <text x="50" y="48" font-size="28" fill="#a78bfa">←</text>
  <text x="800" y="34" text-anchor="middle" font-size="18" fill="#818cf8">🌌 Outer Space  ›  Lesson 3</text>
  <text x="800" y="62" text-anchor="middle" font-size="15" fill="#4c1d95">Space Station Safety</text>
  <!-- XP badge -->
  <rect x="1420" y="18" width="150" height="44" rx="22" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="1495" y="46" text-anchor="middle" font-size="16" fill="#fde68a">⭐ 240 XP</text>

  <!-- ===== NPC Avatar + Story Card ===== -->
  <!-- NPC on left -->
  <circle cx="160" cy="380" r="90" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
  <text x="160" y="400" text-anchor="middle" font-size="80">👩‍🚀</text>
  <text x="160" y="490" text-anchor="middle" font-size="14" fill="#818cf8">Commander Zara</text>
  <rect x="95" y="504" width="130" height="26" rx="13" fill="#3730a3"/>
  <text x="160" y="522" text-anchor="middle" font-size="12" fill="#c7d2fe">Space Station NPC</text>

  <!-- Speech bubble connector -->
  <polygon points="268,350 310,335 295,380" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Story Card -->
  <rect x="300" y="100" width="1260" height="420" rx="24" fill="url(#storyCard)" stroke="#818cf8" stroke-width="2" filter="url(#storyGlow)"/>
  <!-- Card header -->
  <rect x="300" y="100" width="1260" height="60" rx="24" fill="#3730a3"/>
  <rect x="300" y="136" width="1260" height="24" fill="#3730a3"/>
  <text x="340" y="138" font-size="14" fill="#a5b4fc">📍 Node 3 of 8</text>
  <text x="800" y="138" text-anchor="middle" font-size="14" fill="#c7d2fe" font-weight="600">🌌 Outer Space — Space Station Safety</text>
  <!-- Progress dots -->
  <g transform="translate(1350, 128)">
    <circle cx="-60" cy="0" r="7" fill="#818cf8"/><circle cx="-40" cy="0" r="7" fill="#818cf8"/>
    <circle cx="-20" cy="0" r="7" fill="#4c1d95" stroke="#818cf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#1e1b4b" stroke="#374151" stroke-width="1"/>
    <circle cx="20" cy="0" r="7" fill="#1e1b4b" stroke="#374151" stroke-width="1"/>
    <circle cx="40" cy="0" r="7" fill="#1e1b4b" stroke="#374151" stroke-width="1"/>
    <circle cx="60" cy="0" r="7" fill="#1e1b4b" stroke="#374151" stroke-width="1"/>
    <circle cx="80" cy="0" r="7" fill="#1e1b4b" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Story text -->
  <text x="800" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#e2d9f3">"The air recycler alarm is flashing red!</text>
  <text x="800" y="245" text-anchor="middle" font-size="22" fill="#e2d9f3">Commander Zara rushes over:</text>
  <text x="800" y="300" text-anchor="middle" font-size="26" font-weight="600" fill="#c7d2fe" font-style="italic">"Nova — the repair kit is behind the locked panel.</text>
  <text x="800" y="340" text-anchor="middle" font-size="26" font-weight="600" fill="#c7d2fe" font-style="italic"> We need oxygen restored in 2 minutes.</text>
  <text x="800" y="380" text-anchor="middle" font-size="26" font-weight="600" fill="#c7d2fe" font-style="italic">  What do you do?"</text>

  <!-- Question label -->
  <text x="800" y="460" text-anchor="middle" font-size="18" fill="#818cf8">🤔 What would you do?</text>

  <!-- ===== Choice Buttons ===== -->

  <!-- Choice A (highlighted/hovered) -->
  <rect x="300" y="545" width="1260" height="80" rx="16" fill="url(#choiceA)" stroke="#06b6d4" stroke-width="2.5" filter="url(#choiceHover)"/>
  <text x="340" y="575" font-size="26" fill="#06b6d4">A</text>
  <rect x="374" y="558" width="2" height="50" fill="#06b6d4" opacity="0.5"/>
  <text x="400" y="580" font-size="18" fill="#e2d9f3" font-weight="600">Tell Commander Zara immediately and wait for her to unlock the panel safely</text>
  <text x="400" y="608" font-size="14" fill="#7dd3fc">Asking a trusted adult for help is always the right call in an emergency</text>
  <text x="1520" y="590" text-anchor="end" font-size="26">→</text>

  <!-- Choice B -->
  <rect x="300" y="642" width="1260" height="80" rx="16" fill="url(#choiceB)" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="672" font-size="26" fill="#a78bfa">B</text>
  <rect x="374" y="655" width="2" height="50" fill="#4c1d95" opacity="0.5"/>
  <text x="400" y="677" font-size="18" fill="#9ca3af">Try to open the panel yourself — you've seen Zara do it before</text>
  <text x="400" y="705" font-size="14" fill="#6b7280">Remember: panels lock for a reason. Safety procedures exist to protect everyone</text>

  <!-- Choice C -->
  <rect x="300" y="739" width="1260" height="80" rx="16" fill="url(#choiceC)" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="769" font-size="26" fill="#a78bfa">C</text>
  <rect x="374" y="752" width="2" height="50" fill="#4c1d95" opacity="0.5"/>
  <text x="400" y="774" font-size="18" fill="#9ca3af">Ignore the alarm and continue your mission tasks</text>
  <text x="400" y="802" font-size="14" fill="#6b7280">Alarms signal real danger — never ignore emergency signals</text>

  <!-- XP reward hint -->
  <rect x="1380" y="830" width="180" height="44" rx="22" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1470" y="858" text-anchor="middle" font-size="16" fill="#fde68a">+50 XP on correct</text>
</svg>
