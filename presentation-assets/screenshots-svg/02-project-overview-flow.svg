<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="65" text-anchor="middle" font-size="40" font-weight="800" fill="#e2d9f3">Project Overview — User Journey</text>
  <line x1="300" y1="85" x2="1300" y2="85" stroke="#4c1d95" stroke-width="1.5"/>

  <!-- ===== ROW 1: Steps 1–4 ===== -->
  <!-- Step 1: Parent Login -->
  <rect x="60" y="140" width="200" height="160" rx="18" fill="#1e1040" stroke="#7c3aed" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="160" y="185" text-anchor="middle" font-size="40">👨‍👩‍👧</text>
  <text x="160" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Parent Login</text>
  <text x="160" y="252" text-anchor="middle" font-size="13" fill="#a78bfa">Register &amp; sign in</text>
  <text x="160" y="272" text-anchor="middle" font-size="13" fill="#a78bfa">JWT auth</text>
  <!-- Badge -->
  <rect x="115" y="280" width="90" height="24" rx="12" fill="#4c1d95"/>
  <text x="160" y="296" text-anchor="middle" font-size="12" fill="#c4b5fd">Auth Layer</text>

  <!-- Arrow 1→2 -->
  <line x1="262" y1="220" x2="330" y2="220" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="296" y="210" text-anchor="middle" font-size="11" fill="#7c3aed">+child</text>

  <!-- Step 2: Child Profile -->
  <rect x="332" y="140" width="200" height="160" rx="18" fill="#1e1040" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="432" y="185" text-anchor="middle" font-size="40">👦</text>
  <text x="432" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Child Profile</text>
  <text x="432" y="252" text-anchor="middle" font-size="13" fill="#a78bfa">Name, age</text>
  <text x="432" y="272" text-anchor="middle" font-size="13" fill="#a78bfa">Parent owns child</text>
  <rect x="385" y="280" width="94" height="24" rx="12" fill="#4c1d95"/>
  <text x="432" y="296" text-anchor="middle" font-size="12" fill="#c4b5fd">Children API</text>

  <!-- Arrow 2→3 -->
  <line x1="534" y1="220" x2="602" y2="220" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="568" y="210" text-anchor="middle" font-size="11" fill="#7c3aed">select</text>

  <!-- Step 3: Build Hero -->
  <rect x="604" y="140" width="200" height="160" rx="18" fill="#1e1040" stroke="#ec4899" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="704" y="185" text-anchor="middle" font-size="40">🦸</text>
  <text x="704" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Build Hero</text>
  <text x="704" y="252" text-anchor="middle" font-size="13" fill="#f9a8d4">Choose avatar</text>
  <text x="704" y="272" text-anchor="middle" font-size="13" fill="#f9a8d4">Pick colour</text>
  <rect x="654" y="280" width="100" height="24" rx="12" fill="#831843"/>
  <text x="704" y="296" text-anchor="middle" font-size="12" fill="#fbcfe8">Kid Mode UI</text>

  <!-- Arrow 3→4 -->
  <line x1="806" y1="220" x2="874" y2="220" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="840" y="210" text-anchor="middle" font-size="11" fill="#7c3aed">enter</text>

  <!-- Step 4: Choose World -->
  <rect x="876" y="140" width="200" height="160" rx="18" fill="#1e1040" stroke="#06b6d4" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="976" y="185" text-anchor="middle" font-size="40">🌌</text>
  <text x="976" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Choose World</text>
  <text x="976" y="252" text-anchor="middle" font-size="13" fill="#7dd3fc">Outer Space</text>
  <text x="976" y="272" text-anchor="middle" font-size="13" fill="#7dd3fc">Deep Sea · Forest</text>
  <rect x="926" y="280" width="100" height="24" rx="12" fill="#0c4a6e"/>
  <text x="976" y="296" text-anchor="middle" font-size="12" fill="#bae6fd">Modules API</text>

  <!-- Curved connector down from step 4 to step 5 -->
  <path d="M 976 300 Q 976 380 1248 380" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>

  <!-- ===== ROW 2: Steps 5–7 in reverse direction ===== -->
  <!-- Step 5: Play Scenario -->
  <rect x="1140" y="400" width="200" height="165" rx="18" fill="#1e1040" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="1240" y="445" text-anchor="middle" font-size="40">🎮</text>
  <text x="1240" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Play Scenario</text>
  <text x="1240" y="512" text-anchor="middle" font-size="13" fill="#fde68a">DAG story nodes</text>
  <text x="1240" y="532" text-anchor="middle" font-size="13" fill="#fde68a">Multiple choices</text>
  <rect x="1185" y="545" width="110" height="24" rx="12" fill="#78350f"/>
  <text x="1240" y="561" text-anchor="middle" font-size="12" fill="#fef3c7">Scenario Engine</text>

  <!-- Arrow 5→6 -->
  <line x1="1138" y1="482" x2="1070" y2="482" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead-left)"/>
  <marker id="arrowhead-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
    <polygon points="10 0, 0 3.5, 10 7" fill="#7c3aed"/>
  </marker>
  <text x="1104" y="472" text-anchor="middle" font-size="11" fill="#7c3aed">earn</text>

  <!-- Step 6: Earn XP/Badges -->
  <rect x="868" y="400" width="200" height="165" rx="18" fill="#1e1040" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="968" y="445" text-anchor="middle" font-size="40">🏅</text>
  <text x="968" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Earn XP &amp; Badges</text>
  <text x="968" y="512" text-anchor="middle" font-size="13" fill="#6ee7b7">+XP on complete</text>
  <text x="968" y="532" text-anchor="middle" font-size="13" fill="#6ee7b7">Badge awarded</text>
  <rect x="913" y="545" width="110" height="24" rx="12" fill="#064e3b"/>
  <text x="968" y="561" text-anchor="middle" font-size="12" fill="#a7f3d0">Badge Service</text>

  <!-- Arrow 6→7 -->
  <line x1="866" y1="482" x2="798" y2="482" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead-left)"/>
  <text x="832" y="472" text-anchor="middle" font-size="11" fill="#7c3aed">log</text>

  <!-- Step 7: Parent Reviews -->
  <rect x="596" y="400" width="200" height="165" rx="18" fill="#1e1040" stroke="#60a5fa" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="696" y="445" text-anchor="middle" font-size="40">📊</text>
  <text x="696" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#e2d9f3">Parent Reviews</text>
  <text x="696" y="512" text-anchor="middle" font-size="13" fill="#93c5fd">Progress dashboard</text>
  <text x="696" y="532" text-anchor="middle" font-size="13" fill="#93c5fd">Choice audit trail</text>
  <rect x="638" y="545" width="116" height="24" rx="12" fill="#1e3a5f"/>
  <text x="696" y="561" text-anchor="middle" font-size="12" fill="#bfdbfe">Parent Dashboard</text>

  <!-- ===== 3 World legend at bottom ===== -->
  <rect x="160" y="420" width="380" height="145" rx="16" fill="#120a30" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="350" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Three Story Worlds</text>
  <text x="200" y="490" text-anchor="start" font-size="22">🌌</text>
  <text x="235" y="490" text-anchor="start" font-size="15" fill="#c4b5fd" font-weight="600">Outer Space</text>
  <text x="235" y="510" text-anchor="start" font-size="12" fill="#8b5cf6">Safe routes vs risky shortcuts</text>
  <text x="200" y="535" text-anchor="start" font-size="22">🌊</text>
  <text x="235" y="535" text-anchor="start" font-size="15" fill="#c4b5fd" font-weight="600">The Deep Sea</text>
  <text x="235" y="555" text-anchor="start" font-size="12" fill="#8b5cf6">Stranger danger, asking for help</text>
  <text x="200" y="580" text-anchor="start" font-size="22">🌲</text>
  <text x="235" y="580" text-anchor="start" font-size="15" fill="#c4b5fd" font-weight="600">Enchanted Forest</text>

  <!-- Stats row -->
  <rect x="100" y="720" width="1400" height="110" rx="16" fill="#120a30" stroke="#4c1d95" stroke-width="1.5"/>
  <g fill="#e2d9f3" text-anchor="middle">
    <text x="280" y="762" font-size="36" font-weight="900" fill="#a78bfa">13</text>
    <text x="280" y="792" font-size="14" fill="#8b5cf6">DB Entities</text>
    <line x1="400" y1="730" x2="400" y2="820" stroke="#4c1d95" stroke-width="1"/>
    <text x="560" y="762" font-size="36" font-weight="900" fill="#06b6d4">27</text>
    <text x="560" y="792" font-size="14" fill="#8b5cf6">API Endpoints</text>
    <line x1="700" y1="730" x2="700" y2="820" stroke="#4c1d95" stroke-width="1"/>
    <text x="800" y="762" font-size="36" font-weight="900" fill="#10b981">42</text>
    <text x="800" y="792" font-size="14" fill="#8b5cf6">Pytest Tests</text>
    <line x1="900" y1="730" x2="900" y2="820" stroke="#4c1d95" stroke-width="1"/>
    <text x="1040" y="762" font-size="36" font-weight="900" fill="#f59e0b">3</text>
    <text x="1040" y="792" font-size="14" fill="#8b5cf6">Story Worlds</text>
    <line x1="1160" y1="730" x2="1160" y2="820" stroke="#4c1d95" stroke-width="1"/>
    <text x="1320" y="762" font-size="36" font-weight="900" fill="#ec4899">4–17</text>
    <text x="1320" y="792" font-size="14" fill="#8b5cf6">Target Age Range</text>
  </g>
</svg>
